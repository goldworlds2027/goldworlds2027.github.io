<style>
:root{
  color-scheme:dark;
  --bg:#100b0c; --bg-soft:#181012; --panel:#1b1214; --panel-hi:#241619;
  --cream:#f3eadb; --muted:#b9aa98; --gold:#c9a15a; --gold-bright:#e5c786;
  --gold-dim:#765a32; --wine:#751b2b; --wine-hi:#8e2637;
  --line:rgba(201,161,90,.48); --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--cream);font:16px/1.55 Lato,system-ui,sans-serif;
  background:
    radial-gradient(ellipse 68% 28% at 50% 13%,rgba(104,14,38,.54),transparent 80%),
    radial-gradient(ellipse 48% 25% at 50% 66%,rgba(100,16,38,.16),transparent 78%),
    var(--bg);
}
button,a{-webkit-tap-highlight-color:transparent}
.wrap{width:min(100% - 28px,520px);margin:0 auto;padding:18px 0 36px}
.hero{text-align:center;padding:2px 0 0}
.brand-art{
  display:block;width:min(78%,345px);height:auto;max-height:490px;object-fit:contain;
  margin:0 auto 12px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.18));
}
.brand-fallback{padding:18px 0 4px}
.brand-fallback .eyebrow{font:600 10px Cinzel,serif;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.brand-fallback h1{
  margin:8px 0 2px;font:700 clamp(36px,10vw,52px)/1.08 Cinzel,serif;letter-spacing:.015em;
  color:var(--gold-bright);
}
.brand-fallback .year{font:400 46px/1.2 "Great Vibes",cursive;color:var(--gold)}
.brand-fallback .place{font:400 28px "Great Vibes",cursive;color:var(--cream);margin-top:4px}
.brand-fallback .date{display:inline-block;margin-top:14px;padding:7px 20px;border:1px solid var(--gold-dim);border-radius:3px;color:var(--gold-bright);font:600 13px Cinzel,serif;letter-spacing:.08em}
.countdown{margin:15px 0 0}
.section-label{
  display:flex;align-items:center;gap:12px;justify-content:center;margin:0 0 13px;
  color:var(--gold);font:600 11px Cinzel,serif;letter-spacing:.2em;text-transform:uppercase;
}
.section-label:before,.section-label:after{content:"";height:1px;flex:1;max-width:105px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.section-label:after{transform:scaleX(-1)}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.count-item{
  min-width:0;text-align:center;padding:10px 4px 8px;border:1px solid var(--line);border-radius:9px;
  background:linear-gradient(155deg,rgba(36,22,25,.92),rgba(19,13,14,.96));
}
.count-item b{display:block;color:var(--gold-bright);font:600 clamp(23px,7vw,31px)/1.25 Cinzel,serif;font-variant-numeric:tabular-nums}
.count-item span{display:block;margin-top:2px;color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.tagline{display:block;width:100%;text-align:center!important;margin:17px auto 0;color:var(--gold-bright);font:400 clamp(23px,6vw,29px)/1.3 "Great Vibes",cursive}
main{margin-top:25px}
.group-label{margin:25px 0 12px}
.btn{
  display:flex;align-items:center;gap:13px;width:100%;margin:0 0 9px;padding:12px 14px;
  min-height:70px;background:linear-gradient(110deg,rgba(35,23,25,.92),rgba(24,16,18,.96));
  border:1px solid var(--line);border-radius:13px;color:var(--cream);text-decoration:none;
  transition:border-color .2s ease,background .2s ease,transform .2s ease;
}
a.btn:hover,a.btn:focus-visible{border-color:var(--gold-bright);background:var(--panel-hi);transform:translateY(-1px);outline:none}
.btn.primary{background:linear-gradient(110deg,#762031,#50131f);border-color:rgba(229,199,134,.72)}
.btn.primary:hover,.btn.primary:focus-visible{background:linear-gradient(110deg,#84263a,#5a1725)}
.btn .ic{
  flex:none;width:40px;height:40px;border:1px solid rgba(201,161,90,.45);border-radius:50%;
  display:grid;place-items:center;color:var(--gold-bright);font-size:17px;background:rgba(201,161,90,.07)
}
.btn .tx{flex:1;min-width:0}
.btn .tx strong{display:block;font-size:15px;font-weight:700;line-height:1.3}
.btn .tx small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.35}
.btn .arr{color:var(--gold-bright);font-size:23px;line-height:1;padding:0 2px}
.btn.off{opacity:.62;cursor:default}
.btn.off .arr{display:none}
.soon{flex:none;border:1px solid var(--gold-dim);border-radius:999px;padding:3px 8px;color:var(--gold);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.hotel{padding:15px;margin:0 0 11px;border:1px solid var(--line);border-radius:13px;background:rgba(27,18,20,.82)}
.hotel h3{font:600 16px Cinzel,serif;color:var(--gold-bright)}
.hotel ul{list-style:none;margin:8px 0 12px;color:var(--muted);font-size:13px}
.hotel li{margin:3px 0}
.hotel li:before{content:"•";color:var(--gold);margin-right:8px}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px dashed var(--gold-dim);border-radius:8px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.code b{color:var(--gold-bright);letter-spacing:.04em}
.code button{background:var(--gold);color:#171012;border:0;border-radius:6px;padding:6px 10px;font:700 11px Lato,sans-serif;cursor:pointer}
.hotel .btn{margin:0;min-height:54px}
.social{display:flex;gap:9px;margin-top:4px}
.social .btn{justify-content:center;min-height:54px;padding:9px}
.social .btn .ic{width:30px;height:30px}
.social .btn strong{font-size:13px}
footer{margin-top:28px;padding:18px 8px 0;text-align:center;color:var(--muted);font-size:11px;border-top:1px solid rgba(201,161,90,.2)}
footer .brandline{font:600 11px Cinzel,serif;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
footer p+p{margin-top:5px}
@media(min-width:600px){.wrap{padding-top:28px}.brand-art{width:335px}.countdown{margin-top:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* Cinematic, restrained motion layer */
body{position:relative;isolation:isolate}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.ambient::before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse 45% 35% at 50% 22%,rgba(155,39,64,.17),transparent 80%);animation:ambient-breathe 13s ease-in-out infinite alternate}
.ambient i{position:absolute;left:var(--x);top:110%;width:var(--s);height:var(--s);border-radius:50%;background:#f1d59a;box-shadow:0 0 10px 2px rgba(230,184,100,.38);opacity:0;animation:gold-drift var(--d) linear infinite;animation-delay:var(--delay)}
@keyframes ambient-breathe{from{transform:translate3d(-2%,0,0);opacity:.55}to{transform:translate3d(2%,-3%,0);opacity:1}}
@keyframes gold-drift{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.55}72%{opacity:.32}100%{transform:translate3d(var(--dx),-125vh,0);opacity:0}}
.wrap{position:relative;z-index:1}
.hero{position:relative;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;inset:4% -12% 0;background:radial-gradient(ellipse 50% 45% at 50% 46%,rgba(226,168,87,.18),rgba(117,27,43,.08) 62%,transparent 80%);filter:blur(12px);animation:halo-pulse 9s ease-in-out infinite alternate}
@keyframes halo-pulse{from{opacity:.55;transform:scale(.95)}to{opacity:1;transform:scale(1.07)}}
.brand-art{animation:emblem-entrance 1.7s cubic-bezier(.18,.75,.24,1) both,emblem-lustre 9s ease-in-out 1.7s infinite alternate;transform-origin:center}
@keyframes emblem-entrance{from{opacity:0;transform:translateY(24px) scale(.94);filter:brightness(.6) drop-shadow(0 8px 15px rgba(0,0,0,.12))}to{opacity:1;transform:translateY(0) scale(1);filter:brightness(1) drop-shadow(0 14px 28px rgba(0,0,0,.18))}}
@keyframes emblem-lustre{from{filter:brightness(.96) drop-shadow(0 10px 22px rgba(0,0,0,.18))}to{filter:brightness(1.13) drop-shadow(0 0 25px rgba(220,164,91,.20))}}
.countdown{animation:content-enter 1.2s ease .55s both}
@keyframes content-enter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
.btn,.hotel{position:relative;overflow:hidden}
a.btn::before,.hotel::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 15%,rgba(229,199,134,.10) 48%,transparent 78%);transform:translateX(-110%);transition:opacity .3s ease,transform .8s ease}
a.btn:hover::before,a.btn:focus-visible::before,.hotel:hover::after{opacity:1;transform:translateX(110%)}
a.btn:hover,a.btn:focus-visible{box-shadow:0 0 0 1px rgba(229,199,134,.22),0 9px 30px rgba(112,36,52,.22)}
.hotel{transition:border-color .35s ease,box-shadow .35s ease,transform .35s ease}
.hotel:hover{border-color:rgba(229,199,134,.7);box-shadow:0 12px 30px rgba(0,0,0,.16);transform:translateY(-2px)}
.reveal-ready .reveal{opacity:0;transform:translateY(24px);transition:opacity .85s cubic-bezier(.2,.75,.25,1),transform .85s cubic-bezier(.2,.75,.25,1);transition-delay:var(--reveal-delay,0ms)}
.reveal-ready .reveal.is-visible{opacity:1;transform:translateY(0)}
@media(prefers-reduced-motion:reduce){.ambient{display:none}.hero::before{animation:none}.brand-art,.countdown{animation:none!important}.reveal-ready .reveal{opacity:1;transform:none;transition:none}a.btn::before,.hotel::after{display:none}}

/* Theatrical velvet: sculpted pleats, velvet nap and stage lighting */
body{background:#10050b}
body::before{
 content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background:
 radial-gradient(ellipse 55% 43% at 50% -9%,rgba(255,192,157,.30),transparent 78%),
 radial-gradient(ellipse 92% 67% at 50% 10%,rgba(135,23,49,.20),transparent 77%),
 linear-gradient(90deg,rgba(5,1,5,.60),transparent 20%,transparent 80%,rgba(5,1,5,.68)),
 repeating-linear-gradient(90deg,
 #100309 0%,#270711 3%,#591227 8%,#87233c 11%,#5c142a 14%,
 #2a0713 18%,#12040a 21%,#1a0510 23%,#451023 28%,
 #742039 32%,#4d1025 36%,#18040c 41%,#0b0207 44%,
 #270713 47%,#6b1b35 53%,#8a2842 56%,#5b142b 59%,
 #20050f 65%,#100309 69%);
 background-size:100% 100%,100% 100%,100% 100%,clamp(430px,100vw,1150px) 100%;
 filter:contrast(1.08);
}
body::after{
 content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(10,2,8,.08),rgba(9,2,7,.14) 35%,rgba(4,1,5,.62) 100%);
 box-shadow:inset 0 0 120px 30px rgba(4,1,5,.6);
}
.velvet-texture{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.23;mix-blend-mode:soft-light}
.stage-light{position:fixed;inset:-10% 0 0;z-index:0;pointer-events:none;background:conic-gradient(from 171deg at 50% -4%,transparent 0deg,rgba(235,167,131,.045) 8deg,transparent 19deg,transparent 341deg,rgba(235,167,131,.045) 352deg,transparent 360deg);animation:stage-light-breathe 12s ease-in-out infinite alternate}
@keyframes stage-light-breathe{from{opacity:.5}to{opacity:1}}
.ambient{z-index:0}
.wrap{z-index:1}
@media(max-width:600px){body::before{background-size:100% 100%,100% 100%,100% 100%,560px 100%}.velvet-texture{opacity:.18}}
@media(prefers-reduced-motion:reduce){.stage-light{animation:none}}
</style>
</head>
<body>
<svg class="velvet-texture" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
<filter id="velvet-grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".42 .82" numOctaves="3" seed="17" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
</filter>
<rect width="100%" height="100%" filter="url(#velvet-grain)" opacity=".7"/>
</svg><div class="stage-light" aria-hidden="true"></div>
<div class="ambient" aria-hidden="true"><i style="--x:8%;--s:2px;--d:19s;--delay:-2s;--dx:42px"></i><i style="--x:17%;--s:3px;--d:25s;--delay:-14s;--dx:-34px"></i><i style="--x:27%;--s:2px;--d:22s;--delay:-7s;--dx:50px"></i><i style="--x:37%;--s:2px;--d:28s;--delay:-19s;--dx:-25px"></i><i style="--x:49%;--s:3px;--d:24s;--delay:-11s;--dx:45px"></i><i style="--x:60%;--s:2px;--d:20s;--delay:-4s;--dx:-48px"></i><i style="--x:72%;--s:2px;--d:27s;--delay:-21s;--dx:31px"></i><i style="--x:84%;--s:3px;--d:23s;--delay:-16s;--dx:-42px"></i><i style="--x:94%;--s:2px;--d:26s;--delay:-8s;--dx:30px"></i><i style="--x:43%;--s:1px;--d:30s;--delay:-23s;--dx:-20px"></i></div>
<div class="wrap">
<header class="hero">
    <img class="brand-art" src="assets/gold-worlds-2027-logo-transparent.png" alt="Gold Worlds 2027 – official event emblem"
      onerror="this.hidden=true;document.querySelector('.brand-fallback').hidden=false">
    <div class="brand-fallback" hidden>
      <p class="eyebrow">Gold Line Dance presents</p>
      <h1>GOLD WORLDS</h1><p class="year">2027</p>
      <p class="place">Schwechat · Vienna</p>
      <p class="date" data-t="dates"></p>
    </div>
  </header>

  <section class="countdown" aria-label="Countdown">
    <div class="section-label" data-t="countdown"></div>
    <div class="count" id="count" aria-live="off"></div>
    <p class="tagline" data-t="tagline" style="text-align:center;width:100%"></p>
  </section>

  <main>
    <div class="section-label group-label" data-t="explore"></div>
    <div id="main-links"></div>

    <div class="section-label group-label" data-t="stay"></div>
    <div id="hotels"></div>
    <div id="travel-links"></div>

    <div class="section-label group-label" data-t="more"></div>

  <footer>
    <p class="brandline">Gold Worlds 2027</p>
    <p>Line Dance World Championship · Schwechat / Vienna</p>
    <p data-t="footer"></p>
  </footer>
</div>

<script>
const T = {
  en:{sub:"Line Dance World Championship",dates:"2 – 5 December 2027",days:"days",hours:"hours",mins:"minutes",secs:"seconds",
      countdown:"The Grand Countdown",tagline:"Let the grand celebration begin.",explore:"Explore the Event",
      stay:"Stay & Travel",more:"More",soon:"Coming soon",code:"Booking code",copy:"Copy",copied:"Copied ✓",book:"Book now",
      airport:"from Vienna Airport",venue:"to the venue",breakfast:"Breakfast included",
      website:["Official information","Schedule, rules & news"],registration:["Registration","Dancers & tickets"],
      shuttle:["Hotel ↔ venue shuttle","Transport information"],tour:["Worlds Sightseeing Tour","Discover Vienna with us"],
      song:["Official song","Listen & learn the dance"],email:["Contact us","Questions? Write to the organisers"],
      footer:"See you on the dance floor!"},
  de:{sub:"Line Dance Weltmeisterschaft",dates:"2. – 5. Dezember 2027",days:"Tage",hours:"Std.",mins:"Min.",secs:"Sek.",
      countdown:"Der große Countdown",tagline:"Das große Fest kann beginnen.",explore:"Entdecke die Veranstaltung",
      stay:"Hotels & Anreise",more:"Mehr",soon:"Demnächst",code:"Buchungscode",copy:"Kopieren",copied:"Kopiert ✓",book:"Jetzt buchen",
      airport:"vom Flughafen Wien",venue:"zum Veranstaltungsort",breakfast:"Frühstück inklusive",
      website:["Offizielle Informationen","Zeitplan, Regeln & News"],registration:["Anmeldung","Tänzer & Tickets"],
      shuttle:["Shuttle Hotel ↔ Halle","Transportinformationen"],tour:["Worlds Sightseeing Tour","Wien mit uns entdecken"],
      song:["Offizieller Song","Anhören & Tanz lernen"],email:["Kontakt","Fragen? Schreib den Veranstaltern"],
      footer:"Wir sehen uns auf der Tanzfläche!"},
  cs:{sub:"Mistrovství světa v line dance",dates:"2. – 5. prosince 2027",days:"dní",hours:"hod.",mins:"min.",secs:"sek.",
      countdown:"Odpočet do zahájení",tagline:"Oslava tance může začít.",explore:"Prozkoumejte událost",
      stay:"Ubytování a doprava",more:"Další",soon:"Již brzy",code:"Rezervační kód",copy:"Kopírovat",copied:"Zkopírováno ✓",book:"Rezervovat",
      airport:"od letiště Vídeň",venue:"na místo konání",breakfast:"Snídaně v ceně",
      website:["Oficiální informace","Program, pravidla a novinky"],registration:["Registrace","Tanečníci a vstupenky"],
      shuttle:["Kyvadlová doprava hotel ↔ hala","Informace o dopravě"],tour:["Worlds Sightseeing Tour","Poznejte s námi Vídeň"],
      song:["Oficiální song","Poslechni si a nauč se tanec"],email:["Kontakt","Máte dotaz? Napište pořadatelům"],
      footer:"Uvidíme se na parketu!"}
};
const HOTELS = [
  {key:"heinhotel",name:"HEINhotel Vienna Airport",airport:"4 km",venue:"3 km"},
  {key:"reinisch",name:"Das Reinisch Vienna Airport",airport:"4 km",venue:"3.2 km"}
];
const EVENT = new Date("2027-12-02T09:00:00+01:00");
const lang = "en";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function href(k){const v=LINKS[k];if(!v)return"";return k==="email"?"mailto:"+v:v}
function btn(k,icon,cls=""){
  const t=T[lang],[title,sub]=t[k],h=href(k);
  const inner=`<span class="ic" aria-hidden="true">${icon}</span><span class="tx"><strong>${esc(title)}</strong><small>${esc(sub)}</small></span>`;
  return h
    ? `<a class="btn ${cls}" href="${esc(h)}" ${h.startsWith("http")?'target="_blank" rel="noopener"':""}>${inner}<span class="arr" aria-hidden="true">›</span></a>`
    : `<div class="btn off ${cls}" aria-disabled="true">${inner}<span class="soon">${esc(t.soon)}</span></div>`;
}
function socialBtn(k,label,icon){
  const h=href(k);
  return h?`<a class="btn" href="${esc(h)}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">${icon}</span><strong>${label}</strong></a>`
    :`<div class="btn off"><span class="ic" aria-hidden="true">${icon}</span><strong>${label}</strong></div>`;
}
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);

  document.getElementById("main-links").innerHTML=btn("registration","✦","primary")+btn("website","i");
  document.getElementById("hotels").innerHTML=HOTELS.map(h=>{
    const link=href(h.key);
    return `<section class="hotel"><h3>${esc(h.name)}</h3>
      <ul><li>${h.airport} ${esc(t.airport)}</li><li>${h.venue} ${esc(t.venue)}</li><li>${esc(t.breakfast)}</li></ul>
      <div class="code"><span>${esc(t.code)}: <b>${esc(CODES[h.key])}</b></span><button data-copy="${esc(CODES[h.key])}">${esc(t.copy)}</button></div>
      ${link?`<a class="btn primary" href="${esc(link)}" ${link.startsWith("http")?'target="_blank" rel="noopener"':""}><span class="ic" aria-hidden="true">⌂</span><span class="tx"><strong>${esc(t.book)}</strong></span><span class="arr">›</span></a>`
      :`<div class="btn off"><span class="ic" aria-hidden="true">⌂</span><span class="tx"><strong>${esc(t.book)}</strong></span><span class="soon">${esc(t.soon)}</span></div>`}</section>`;
  }).join("");
  document.getElementById("travel-links").innerHTML=btn("shuttle","↔")+btn("tour","✧");
  document.getElementById("more-links").innerHTML=btn("song","♫")+btn("email","✉");
  document.getElementById("social").innerHTML=socialBtn("facebook","Facebook","f")+socialBtn("instagram","Instagram","◎");
  tick();
}
function tick(){
  const t=T[lang],ms=EVENT-Date.now(),el=document.getElementById("count");
  if(ms<=0){el.innerHTML="";return}
  const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  el.innerHTML=[[d,t.days],[h,t.hours],[m,t.mins],[s,t.secs]].map(([n,l])=>`<div class="count-item"><b>${String(n).padStart(2,"0")}</b><span>${l}</span></div>`).join("");
}
document.addEventListener("click",e=>{
const c=e.target.closest("[data-copy]");
  if(c&&navigator.clipboard){navigator.clipboard.writeText(c.dataset.copy).then(()=>{c.textContent=T[lang].copied;setTimeout(()=>c.textContent=T[lang].copy,1600)}).catch(()=>{});}
});
render();setInterval(tick,1000);
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window){
  const items=document.querySelectorAll("main .section-label,main .btn,main .hotel,footer");
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("is-visible");observer.unobserve(entry.target)}});
  },{threshold:.09,rootMargin:"0px 0px -20px 0px"});
  items.forEach((item,i)=>{item.classList.add("reveal");item.style.setProperty("--reveal-delay",((i%3)*95)+"ms");observer.observe(item)});
  document.body.classList.add("reveal-ready");
}
</script>
</body>
