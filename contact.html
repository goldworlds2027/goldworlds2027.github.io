<script>
/* CONTACT_API = URL of the Google Apps Script web app (…/exec) – the same one as BOOKING_API in tour.html.
   Messages are stored in the sheet "Contact messages" and forwarded to ASSOCIATION_EMAIL.
   Empty = the form is shown, but sending says "coming soon". */
const CONTACT_API = "";
</script>
<style>
:root{--gold:#d9b25c;--gold-hi:#f3d991;--cream:#f7eedb;--muted:#cdbb9c;--err:#ff8f9c;
 --gold-text:linear-gradient(180deg,#f3d991,#d9b25c 55%,#b98d36)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0b0305;overflow-x:clip}
body{min-height:100vh;color:var(--cream);font:400 16px/1.55 Lato,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
 background:radial-gradient(90% 40% at 50% 0%,rgba(122,20,40,.55),transparent 70%),radial-gradient(80% 40% at 50% 100%,rgba(90,13,26,.4),transparent 70%),#0b0305}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.1;background:url(img/damask.svg) center top/110px 150px}
.gt{background:var(--gold-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold)}
#sparkle{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:min(calc(100% - 32px),640px);margin:0 auto;padding:18px 0 70px}
.back{display:table;margin:0 auto;color:#fff3d4;text-decoration:none;font:600 11px Cinzel,serif;letter-spacing:.16em;text-transform:uppercase;padding:8px 14px;border-radius:999px;background:rgba(10,2,4,.55);box-shadow:0 0 0 1px rgba(217,178,92,.5)}
.back:hover{color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi)}
.hero{text-align:center;padding:42px 0 6px}
.kicker{font:600 11px Cinzel,serif;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
h1{margin-top:10px;font:400 clamp(58px,12vw,92px)/1 "Great Vibes",cursive;color:#ffe9b0;text-shadow:0 0 22px rgba(160,29,51,.6);padding:.1em .3em .15em}
.lead{max-width:460px;margin:6px auto 0;color:var(--muted);font:500 clamp(19px,3.6vw,22px)/1.45 "Cormorant Garamond",serif}

/* form card */
.card{position:relative;margin-top:30px;padding:30px 30px 28px;border-radius:18px;
 background:linear-gradient(160deg,rgba(32,8,13,.96),rgba(14,4,6,.97));
 box-shadow:0 0 0 1px rgba(217,178,92,.6),inset 0 0 0 6px rgba(10,2,4,.85),inset 0 0 0 7px rgba(217,178,92,.22),0 18px 40px rgba(0,0,0,.5)}
@media(max-width:560px){.card{padding:24px 18px 22px}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.f{display:block;margin-top:16px}.row .f{margin-top:0}.row+.f,.f+.row{margin-top:16px}
.f span{display:block;margin-bottom:6px;font:600 11px Cinzel,serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
input,select,textarea{width:100%;font:16px/1.4 Lato,system-ui,sans-serif;color:#fff6e4;background:rgba(8,2,4,.7);border:1px solid rgba(217,178,92,.35);border-radius:10px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{min-height:150px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
select option{background:#1a0509;color:#fff6e4}
input::placeholder,textarea::placeholder{color:rgba(205,187,156,.55)}
input:focus,select:focus,textarea:focus{border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(217,178,92,.18)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--err)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{margin-top:14px;font-size:13.5px;color:var(--muted)}
.send{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:58px;margin-top:20px;border:0;border-radius:14px;cursor:pointer;
 background:linear-gradient(180deg,#7d1426,#4a0a14);box-shadow:0 0 0 1px var(--gold),inset 0 0 0 4px rgba(20,3,7,.6),inset 0 0 0 5px rgba(217,178,92,.35),0 10px 24px rgba(0,0,0,.45);
 font:600 16px Cinzel,serif;letter-spacing:.1em;color:#ffe9b0;transition:filter .2s,transform .2s}
.send:hover{filter:brightness(1.12)}.send:active{transform:translateY(1px)}
.send[disabled]{cursor:default;filter:saturate(.6) brightness(.85)}
.soon{font:600 10px/1 Cinzel,serif;letter-spacing:.14em;border:1px solid var(--gold);color:var(--gold);padding:6px 9px;border-radius:999px;text-transform:uppercase}
.msg{margin-top:14px;text-align:center;font-size:15px}.msg.err{color:var(--err)}
.done{display:none;text-align:center;padding:16px 4px 6px}
.done b{display:block;font:400 46px/1.1 "Great Vibes",cursive;color:#ffe9b0}
.done p{margin-top:10px;color:#eadfca;font:500 20px/1.45 "Cormorant Garamond",serif}
.card.sent form{display:none}.card.sent .done{display:block}
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<canvas id="sparkle" aria-hidden="true"></canvas>
<main class="wrap">
  <a class="back" href="./">‹ Gold Worlds 2027</a>

  <header class="hero">
    <div class="kicker">Gold Worlds 2027 · Vienna</div>
    <h1>Contact us</h1>
  </header>

  <section class="card rv" id="card">
    <form id="form" novalidate>
      <div class="row">
        <label class="f"><span>Name</span><input name="name" autocomplete="name" maxlength="120" required></label>
        <label class="f"><span>E-mail</span><input name="email" type="email" autocomplete="email" maxlength="160" required></label>
      </div>
      <label class="f"><span>Topic</span>
        <select name="topic">
          <option>General question</option><option>Registration</option><option>Hotels &amp; shuttle</option>
          <option>Worlds Sightseeing Tour</option><option>Theme Parties</option><option>Other</option>
        </select>
      </label>
      <label class="f"><span>Message</span><textarea name="message" maxlength="3000" required></textarea></label>
      <label class="hp" aria-hidden="true">Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label>
      <p class="note">We use your details only to reply to your message.</p>
      <button class="send" id="send" type="submit">Send message</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div class="done" id="done" tabindex="-1"><b>Thank you!</b><p>Your message is on its way. We’ll get back to you soon.</p></div>
  </section>
</main>
<script>
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));

// form: stored in the Google Sheet and forwarded by e-mail through the Apps Script web app (CONTACT_API)
(()=>{
  const f=document.getElementById("form"),send=document.getElementById("send"),msg=document.getElementById("msg"),card=document.getElementById("card");
  if(!CONTACT_API){send.disabled=true;send.innerHTML='Send message <span class="soon">Coming soon</span>';}
  const bad=(t)=>{msg.className="msg err";msg.textContent=t};
  f.addEventListener("submit",async ev=>{
    ev.preventDefault();msg.textContent="";
    const d=Object.fromEntries(new FormData(f));
    const check=[["name",d.name.trim().length>1],["email",/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email.trim())],["message",d.message.trim().length>4]];
    check.forEach(([k,ok])=>f.elements[k].closest(".f").classList.toggle("bad",!ok));
    if(check.some(([,ok])=>!ok))return bad("Please fill in your name, a valid e-mail and your message.");
    if(!CONTACT_API)return bad("The contact form is not connected yet – please try again later.");
    send.disabled=true;send.textContent="Sending…";
    try{
      const r=await fetch(CONTACT_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({type:"contact",name:d.name.trim(),email:d.email.trim(),topic:d.topic,message:d.message.trim(),_honey:d.website})});
      const j=await r.json();if(!j.ok)throw new Error(j.error||"error");
      card.classList.add("sent");document.getElementById("done").focus();
    }catch(e){send.disabled=false;send.textContent="Send message";bad("Sorry, your message could not be sent. Please try again in a moment.");}
  });
  f.addEventListener("input",e=>e.target.closest(".f")?.classList.remove("bad"));
})();

// gentle gold sparkles in the background (same as the Theme Parties page)
(()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const c=document.getElementById("sparkle"),x=c.getContext("2d");let W,H,dpr,P=[];
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
 const n=Math.round(Math.min(70,W*H/16000));P=Array.from({length:n},()=>mk(true))}
function mk(any){return{x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.4,t:any?Math.random()*6:0,d:3+Math.random()*5,star:Math.random()<.22,dy:-(2+Math.random()*6)}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;x.clearRect(0,0,W,H);
 for(const p of P){p.t+=dt;p.y+=p.dy*dt;if(p.t>p.d){Object.assign(p,mk(false))}
  const a=Math.sin(Math.PI*p.t/p.d)**2;
  x.globalAlpha=a*.85;x.fillStyle="#f3d991";x.shadowColor="rgba(243,217,145,.9)";x.shadowBlur=6;
  x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();
  if(p.star&&a>.3){const L=p.r*5*a;x.globalAlpha=a*.6;x.shadowBlur=0;x.strokeStyle="#ffe9b0";x.lineWidth=.7;
   x.beginPath();x.moveTo(p.x-L,p.y);x.lineTo(p.x+L,p.y);x.moveTo(p.x,p.y-L);x.lineTo(p.x,p.y+L);x.stroke()}}
 x.globalAlpha=1;requestAnimationFrame(frame)}
size();addEventListener("resize",size);requestAnimationFrame(frame)})();
</script>
</body>
</html>
