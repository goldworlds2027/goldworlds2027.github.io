<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Worlds 2027</title>
<meta name="description" content="Line Dance World Championship – Gold Worlds 2027, Schwechat / Vienna, 2–5 December 2027">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Great+Vibes&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   ODKAZY – tady se upravuje obsah. Prázdný odkaz "" = tlačítko ukáže
   "Již brzy / Coming soon" a nedá se na něj kliknout.
   ===================================================================== */
const LINKS = {
  website:      "",   // oficiální web akce
  registration: "",   // registrace soutěžících / vstupenky
  heinhotel:    "",   // rezervace HEINhotel (odkaz nebo mailto:adresa@...)
  reinisch:     "",   // rezervace Das Reinisch
  shuttle:      "",   // rezervace kyvadlové dopravy
  tour:         "",   // Worlds Sightseeing Tour
  song:         "",   // oficiální song (YouTube / Spotify)
  facebook:     "",
  instagram:    "",
  email:        ""    // kontaktní e-mail pořadatele (jen adresa, bez mailto:)
};
const CODES = { heinhotel: "Linedance WM", reinisch: "Linedance" };
</script>
<style>
:root{
  --bg:#0b0907; --panel:#16110d; --cream:#f6ecd9; --muted:#c9b99a;
  --gold:#d4a84b; --gold-hi:#f3d98b; --gold-lo:#9c7425;
  --wine:#7d1426; --wine-hi:#a01d33;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  min-height:100vh;color:var(--cream);font:16px/1.5 Lato,system-ui,sans-serif;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(125,20,38,.35),transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%,rgba(212,168,75,.12),transparent 70%),
    var(--bg);
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}

/* jazyky */
.lang{display:flex;justify-content:flex-end;gap:6px}
.lang button{
  background:none;border:1px solid var(--gold-lo);color:var(--muted);
  font:700 12px Lato,sans-serif;letter-spacing:.08em;padding:5px 9px;border-radius:999px;cursor:pointer
}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--bg);border-color:var(--gold)}

/* hlavička */
header{text-align:center;padding:12px 0 8px}
.crown{width:64px;height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 2px 6px rgba(212,168,75,.4))}
h1{
  font:800 clamp(40px,12vw,58px)/1 Cinzel,serif;letter-spacing:.02em;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
h1 .yr{display:block;font-family:"Great Vibes",cursive;font-weight:400;font-size:.9em;margin-top:2px}
.sub{font:600 13px Cinzel,serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.ribbon{
  display:inline-block;margin-top:14px;padding:8px 22px;background:linear-gradient(180deg,var(--wine-hi),var(--wine));
  border:1px solid var(--gold);border-radius:4px;font:700 17px Cinzel,serif;color:var(--gold-hi);letter-spacing:.05em
}
.place{margin-top:10px;font-family:"Great Vibes",cursive;font-size:28px;color:var(--gold)}

/* odpočet */
.count{display:flex;justify-content:center;gap:10px;margin:18px 0 6px}
.count div{min-width:64px;padding:8px 4px;border:1px solid var(--gold-lo);border-radius:8px;background:var(--panel);text-align:center}
.count b{display:block;font:800 22px Cinzel,serif;color:var(--gold-hi)}
.count span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.divider{display:flex;align-items:center;gap:10px;margin:26px 0 12px;color:var(--gold);font:600 13px Cinzel,serif;letter-spacing:.16em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent)}

/* tlačítka */
.btn{
  display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;padding:14px 16px;
  background:linear-gradient(180deg,#1d1611,var(--panel));border:1px solid var(--gold-lo);border-radius:12px;
  color:var(--cream);text-decoration:none;transition:border-color .15s,transform .15s
}
a.btn:hover,a.btn:focus-visible{border-color:var(--gold-hi);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--wine-hi),var(--wine));border-color:var(--gold)}
.btn .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(212,168,75,.14);color:var(--gold-hi);font-size:19px}
.btn .tx{flex:1;min-width:0}
.btn .tx strong{display:block;font-weight:700}
.btn .tx small{display:block;color:var(--muted);font-size:13px}
.btn .arr{color:var(--gold);font-size:20px}
.btn.off{opacity:.5;cursor:default}
.btn.off .arr{display:none}
.soon{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-lo);border-radius:999px;padding:2px 8px}

/* hotely */
.hotel{border:1px solid var(--gold-lo);border-radius:12px;background:var(--panel);padding:16px;margin-bottom:12px}
.hotel h3{font:700 18px Cinzel,serif;color:var(--gold-hi)}
.hotel ul{list-style:none;margin:8px 0 12px;color:var(--muted);font-size:14px}
.hotel li::before{content:"✦ ";color:var(--gold)}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px dashed var(--gold);border-radius:8px;margin-bottom:10px;font-size:14px}
.code b{color:var(--gold-hi);letter-spacing:.04em}
.code button{background:var(--gold);color:var(--bg);border:0;border-radius:6px;padding:6px 10px;font:700 12px Lato,sans-serif;cursor:pointer}
.hotel .btn{margin:0}

.social{display:flex;gap:10px}
.social .btn{justify-content:center}

footer{margin-top:32px;text-align:center;color:var(--muted);font-size:13px}
footer .orn{color:var(--gold);letter-spacing:.4em}
</style>
</head>
<body>
<div class="wrap">
  <nav class="lang" aria-label="Language">
    <button data-l="en">EN</button><button data-l="de">DE</button><button data-l="cs">CZ</button>
  </nav>

  <header>
    <svg class="crown" viewBox="0 0 64 44" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d98b"/><stop offset="1" stop-color="#9c7425"/></linearGradient></defs>
      <path d="M4 14l14 12L32 4l14 22 14-12-6 26H10z" fill="url(#g)" stroke="#f3d98b" stroke-width="1"/>
      <circle cx="32" cy="4" r="3.5" fill="#a01d33" stroke="#f3d98b"/><circle cx="4" cy="14" r="3" fill="#f3d98b"/><circle cx="60" cy="14" r="3" fill="#f3d98b"/>
      <rect x="10" y="36" width="44" height="6" rx="1" fill="url(#g)"/><circle cx="32" cy="30" r="3" fill="#a01d33"/>
    </svg>
    <h1>Gold Worlds<span class="yr">2027</span></h1>
    <p class="sub" data-t="sub"></p>
    <div class="ribbon" data-t="dates"></div>
    <p class="place">Schwechat · Vienna</p>
    <div class="count" id="count" aria-live="off"></div>
  </header>

  <main>
    <div id="main-links"></div>

    <div class="divider" data-t="stay"></div>
    <div id="hotels"></div>
    <div id="travel-links"></div>

    <div class="divider" data-t="more"></div>
    <div id="more-links"></div>
    <div class="social" id="social"></div>
  </main>

  <footer>
    <p class="orn">✦ ✦ ✦</p>
    <p>Gold Worlds 2027 · Line Dance World Championship</p>
    <p data-t="footer"></p>
  </footer>
</div>

<script>
const T = {
  en:{sub:"Line Dance World Championship",dates:"2 – 5 December 2027",days:"days",hours:"hours",mins:"min",
      stay:"Stay & Travel",more:"More",soon:"Coming soon",code:"Booking code",copy:"Copy",copied:"Copied ✓",book:"Book now",
      airport:"from Vienna Airport",venue:"to the venue",breakfast:"Breakfast included",
      website:["Official information","Schedule, rules & news"],registration:["Registration","Dancers & tickets"],
      shuttle:["Shuttle hotel ↔ venue","Available for booking"],tour:["Worlds Sightseeing Tour","Vienna · 29 Nov – 1 Dec 2027"],
      song:["Official song","Listen & learn the dance"],email:["Contact us","Questions? Write to the organisers"],
      footer:"See you on the dance floor!"},
  de:{sub:"Line Dance Weltmeisterschaft",dates:"2. – 5. Dezember 2027",days:"Tage",hours:"Std.",mins:"Min.",
      stay:"Hotels & Anreise",more:"Mehr",soon:"Demnächst",code:"Buchungscode",copy:"Kopieren",copied:"Kopiert ✓",book:"Jetzt buchen",
      airport:"vom Flughafen Wien",venue:"zum Veranstaltungsort",breakfast:"Inklusive Frühstück",
      website:["Offizielle Informationen","Zeitplan, Regeln & News"],registration:["Anmeldung","Tänzer & Tickets"],
      shuttle:["Shuttle Hotel ↔ Halle","Buchbar"],tour:["Worlds Sightseeing Tour","Wien · 29.11. – 1.12.2027"],
      song:["Offizieller Song","Anhören & Tanz lernen"],email:["Kontakt","Fragen? Schreib den Veranstaltern"],
      footer:"Wir sehen uns auf der Tanzfläche!"},
  cs:{sub:"Mistrovství světa v line dance",dates:"2. – 5. prosince 2027",days:"dní",hours:"hod.",mins:"min.",
      stay:"Ubytování a doprava",more:"Další",soon:"Již brzy",code:"Rezervační kód",copy:"Kopírovat",copied:"Zkopírováno ✓",book:"Rezervovat",
      airport:"od letiště Vídeň",venue:"na místo konání",breakfast:"Snídaně v ceně",
      website:["Oficiální informace","Program, pravidla a novinky"],registration:["Registrace","Tanečníci a vstupenky"],
      shuttle:["Kyvadlová doprava hotel ↔ hala","Možnost rezervace"],tour:["Worlds Sightseeing Tour","Vídeň · 29. 11. – 1. 12. 2027"],
      song:["Oficiální song","Poslechni si a nauč se tanec"],email:["Kontakt","Máte dotaz? Napište pořadatelům"],
      footer:"Uvidíme se na parketu!"}
};
const HOTELS = [
  {key:"heinhotel",name:"HEINhotel Vienna Airport",airport:"4 km",venue:"3 km"},
  {key:"reinisch",name:"Das Reinisch Vienna Airport",airport:"4 km",venue:"3,2 km"}
];
const EVENT = new Date("2027-12-02T09:00:00+01:00");

let lang = "en";
try{ lang = localStorage.getItem("gw-lang") || (navigator.language||"").slice(0,2); }catch(e){}
if(!T[lang]) lang = (navigator.language||"").startsWith("cs") ? "cs" : "en";

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function href(k){ const v = LINKS[k]; if(!v) return ""; return k==="email" ? "mailto:"+v : v; }

function btn(k, icon, cls=""){
  const t = T[lang], [title, sub] = t[k], h = href(k);
  const inner = `<span class="ic" aria-hidden="true">${icon}</span><span class="tx"><strong>${esc(title)}</strong><small>${esc(sub)}</small></span>`;
  return h
    ? `<a class="btn ${cls}" href="${esc(h)}" ${h.startsWith("http")?'target="_blank" rel="noopener"':""}>${inner}<span class="arr">›</span></a>`
    : `<div class="btn off ${cls}" aria-disabled="true">${inner}<span class="soon">${esc(t.soon)}</span></div>`;
}
function socialBtn(k, label, icon){
  const h = href(k);
  return h ? `<a class="btn" href="${esc(h)}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">${icon}</span><strong>${label}</strong></a>`
           : `<div class="btn off"><span class="ic" aria-hidden="true">${icon}</span><strong>${label}</strong></div>`;
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l===lang));

  document.getElementById("main-links").innerHTML = btn("registration","✎","primary") + btn("website","ℹ");
  document.getElementById("hotels").innerHTML = HOTELS.map(h => {
    const link = href(h.key);
    return `<div class="hotel"><h3>${esc(h.name)}</h3>
      <ul><li>${h.airport} ${esc(t.airport)}</li><li>${h.venue} ${esc(t.venue)}</li><li>${esc(t.breakfast)}</li></ul>
      <div class="code"><span>${esc(t.code)}: <b>${esc(CODES[h.key])}</b></span><button data-copy="${esc(CODES[h.key])}">${esc(t.copy)}</button></div>
      ${link ? `<a class="btn primary" href="${esc(link)}" ${link.startsWith("http")?'target="_blank" rel="noopener"':""}><span class="ic">🛏</span><span class="tx"><strong>${esc(t.book)}</strong></span><span class="arr">›</span></a>`
             : `<div class="btn off"><span class="ic">🛏</span><span class="tx"><strong>${esc(t.book)}</strong></span><span class="soon">${esc(t.soon)}</span></div>`}
    </div>`;
  }).join("");
  document.getElementById("travel-links").innerHTML = btn("shuttle","🚌") + btn("tour","🎡");
  document.getElementById("more-links").innerHTML = btn("song","♫") + btn("email","✉");
  document.getElementById("social").innerHTML = socialBtn("facebook","Facebook","f") + socialBtn("instagram","Instagram","◎");
  tick();
}

function tick(){
  const t = T[lang], ms = EVENT - Date.now(), el = document.getElementById("count");
  if(ms <= 0){ el.innerHTML = ""; return; }
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60;
  el.innerHTML = [[d,t.days],[h,t.hours],[m,t.mins]].map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join("");
}

document.addEventListener("click", e => {
  const l = e.target.closest(".lang button");
  if(l){ lang = l.dataset.l; try{localStorage.setItem("gw-lang",lang)}catch(_){} render(); return; }
  const c = e.target.closest("[data-copy]");
  if(c){ navigator.clipboard?.writeText(c.dataset.copy).then(()=>{ c.textContent = T[lang].copied; setTimeout(()=>c.textContent=T[lang].copy,1600); }); }
});
render();
setInterval(tick, 30000);
</script>
</body>
</html>
